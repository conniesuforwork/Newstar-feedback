<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #EADCD8;        /* 霧粉 */
    --paper: #F9F3F1;     /* 奶白 */
    --rose: #B5898A;      /* 乾燥玫瑰 */
    --rose-deep: #8E6566;
    --ink: #5B4A4C;       /* 深灰紫 */
    --muted: #9A8789;
    --line: #DCCBC6;      /* 奶茶線 */
    --sage: #A3AE9E;      /* 灰綠 */
    --chip: #F1E6E3;
    --serif: "Noto Serif TC", "Songti TC", serif;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 28px 18px 48px; }

  header { padding: 18px 6px 26px; }
  .brand { font-size: 13px; color: var(--rose-deep); letter-spacing: .08em; margin: 0 0 18px; }
  h1 { font-family: var(--serif); font-weight: 700; font-size: 34px; line-height: 1.25; margin: 0 0 14px; }
  h1 .sec { display: inline-block; font-size: 64px; line-height: 1; color: var(--rose); margin-right: 4px; vertical-align: -6px; }
  .lead { margin: 0; font-size: 15px; line-height: 1.8; }
  .promise {
    margin: 16px 0 0; padding: 10px 14px;
    border-left: 3px solid var(--sage);
    background: rgba(255,255,255,.35);
    border-radius: 0 10px 10px 0;
    font-size: 13.5px;
  }

  .progress { height: 4px; background: rgba(255,255,255,.55); border-radius: 4px; margin: 0 6px 18px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--rose); transition: width .35s ease; }

  form { background: var(--paper); border-radius: 22px; padding: 6px 20px 24px; }
  fieldset { border: 0; margin: 0; padding: 22px 0 6px; border-bottom: 1px dashed var(--line); }
  legend { padding: 0; margin-bottom: 12px; font-family: var(--serif); font-weight: 500; font-size: 18px; line-height: 1.45; }
  legend .no { color: var(--rose); margin-right: 6px; font-size: 15px; }
  .hint { font-size: 13px; color: var(--muted); margin: -6px 0 12px; }

  .chips { display: flex; flex-wrap: wrap; gap: 9px; }
  .chips.stack { flex-direction: column; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span {
    display: block; padding: 11px 16px;
    background: var(--chip); border: 1.5px solid transparent; border-radius: 14px;
    font-size: 15px; cursor: pointer; user-select: none;
    transition: background .15s, border-color .15s, color .15s;
  }
  .chips.stack .chip span { padding: 13px 16px; }
  .chip input:checked + span { background: var(--rose); color: #fff; border-color: var(--rose); }
  .chip input:focus-visible + span { outline: 2px solid var(--rose-deep); outline-offset: 2px; }
  .chip.unknown span { background: transparent; border: 1.5px dashed var(--line); color: var(--muted); }
  .chip.unknown input:checked + span { background: var(--muted); border-color: var(--muted); color: #fff; }

  .other-box { display: none; margin-top: 10px; }
  .other-box.show { display: block; }
  .other-box input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--line); border-radius: 12px;
    font: inherit; color: var(--ink); background: #fff;
  }
  .other-box input:focus { outline: none; border-color: var(--rose); }

  .err { color: #A0524F; font-size: 14px; min-height: 22px; margin: 16px 0 0; text-align: center; }
  button[type=submit] {
    display: block; width: 100%; margin-top: 8px; padding: 15px;
    border: 0; border-radius: 16px;
    background: var(--rose-deep); color: #fff;
    font: 500 17px var(--sans); letter-spacing: .06em; cursor: pointer;
  }
  button[type=submit]:disabled { background: #C9B3B3; cursor: default; }
  button[type=submit]:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .state { background: var(--paper); border-radius: 22px; padding: 44px 24px; text-align: center; }
  .state h2 { font-family: var(--serif); font-size: 24px; margin: 14px 0 8px; }
  .state p { margin: 0; color: var(--muted); font-size: 15px; }
  .mark { width: 64px; height: 64px; margin: 0 auto; border-radius: 50%; background: var(--sage); color: #fff; display: grid; place-items: center; font-size: 30px; }
  .done .mark { animation: pop .5s ease-out; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 22px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="brand">欣莘醫美集團</p>
    <h1><span class="sec">30</span>秒<br>匿名回饋</h1>
    <p class="lead">今天謝謝妳來～我們想改善諮詢品質，可以幫我們做一個 30 秒匿名回饋嗎？</p>
    <p class="promise" id="promise">不會影響後續優惠，也不會由諮詢師看到個人答案。</p>
  </header>

  <div class="progress" id="progressBar"><i id="progressFill"></i></div>

  <form id="form" novalidate>
    <fieldset id="clinicSet">
      <legend>今天在哪間診所諮詢？</legend>
      <div class="chips" id="clinicChips"></div>
    </fieldset>

    <fieldset>
      <legend>今天為妳諮詢的是哪位諮詢師？</legend>
      <p class="hint" id="consultantHint">先選診所，就會出現諮詢師名單</p>
      <div class="chips" id="consultantChips"></div>
    </fieldset>

    <fieldset>
      <legend><span class="no">Q1</span>今天沒有安排療程，原因是？</legend>
      <p class="hint">可複選</p>
      <div class="chips stack" id="q1Chips"></div>
      <div class="other-box" id="otherBox">
        <input type="text" id="q1Other" maxlength="200" placeholder="可以簡單寫一下原因">
      </div>
    </fieldset>

    <fieldset>
      <legend><span class="no">Q2</span>如果只能選一個，我們今天哪個地方最沒有說服妳？</legend>
      <div class="chips" id="q2Chips"></div>
    </fieldset>

    <fieldset style="border-bottom:0">
      <legend><span class="no">Q3</span>未來還會考慮我們嗎？</legend>
      <div class="chips" id="q3Chips"></div>
    </fieldset>

    <p class="err" id="err" role="alert"></p>
    <button type="submit" id="submitBtn">送出回饋</button>
  </form>

  <div id="done" class="state done" hidden>
    <div class="mark">✓</div>
    <h2>已送出，謝謝妳！</h2>
    <p>妳的意見會幫助我們把諮詢做得更好。</p>
  </div>

  <footer>匿名填寫｜不收集姓名與電話</footer>
</div>

<script>
  // 診所＋諮詢師名單由試算表帶入
  const CLINICS = <?!= clinicsJson ?>;
  const PRESET = <?= preset ?>;

  const UNKNOWN = '不記得名字';
  const Q1 = ['價格超過預算','還想比較其他診所','對醫師／技術還不夠有信心','案例／效果沒有打中我','擔心手術風險／恢復期','時間還沒辦法安排','需要跟家人討論','本來就只是先了解','其他'];
  const Q2 = ['價格','醫師','案例','方案','諮詢體驗','都還不錯，只是目前沒打算做'];
  const Q3 = ['很有可能','還會比較','機率不高'];

  const $ = id => document.getElementById(id);

  function chip(name, value, extraClass, type) {
    const label = document.createElement('label');
    label.className = 'chip' + (extraClass ? ' ' + extraClass : '');
    const input = document.createElement('input');
    input.type = type || 'radio'; input.name = name; input.value = value;
    const span = document.createElement('span');
    span.textContent = value;
    label.append(input, span);
    return label;
  }

  function renderOptions(boxId, name, list, type) {
    const box = $(boxId);
    box.innerHTML = '';
    list.forEach(v => box.appendChild(chip(name, v, '', type)));
  }

  const vals = name => [...document.querySelectorAll('input[name="' + name + '"]:checked')].map(i => i.value);

  function renderConsultants(clinicName) {
    const box = $('consultantChips');
    box.innerHTML = '';
    const c = CLINICS.find(x => x.name === clinicName);
    if (!c) { $('consultantHint').hidden = false; return; }
    $('consultantHint').hidden = true;
    c.consultants.forEach(n => box.appendChild(chip('consultant', n)));
    box.appendChild(chip('consultant', UNKNOWN, 'unknown'));
  }

  const val = name => (document.querySelector('input[name="' + name + '"]:checked') || {}).value || '';

  function updateProgress() {
    const keys = ['clinic','consultant','q1','q2','q3'];
    const n = keys.filter(k => k === 'q1' ? vals('q1').length : val(k)).length;
    $('progressFill').style.width = (n / keys.length * 100) + '%';
  }

  // 初始化
  CLINICS.forEach(c => $('clinicChips').appendChild(chip('clinic', c.name)));
  if (PRESET && CLINICS.some(c => c.name === PRESET)) {
    // 網址有 ?clinic=診所名稱 → 自動選好並隱藏診所題
    [...document.querySelectorAll('input[name="clinic"]')].find(i => i.value === PRESET).checked = true;
    $('clinicSet').hidden = true;
    renderConsultants(PRESET);
  }
  renderOptions('q1Chips', 'q1', Q1, 'checkbox');
  renderOptions('q2Chips', 'q2', Q2);
  renderOptions('q3Chips', 'q3', Q3);
  updateProgress();

  $('form').addEventListener('change', e => {
    if (e.target.name === 'clinic') renderConsultants(e.target.value);
    if (e.target.name === 'q1') {
      const show = vals('q1').indexOf('其他') >= 0;
      $('otherBox').classList.toggle('show', show);
      if (show && e.target.value === '其他') $('q1Other').focus();
    }
    $('err').textContent = '';
    updateProgress();
  });

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const d = {
      clinic: val('clinic'), consultant: val('consultant'),
      q1: vals('q1'), q1Other: $('q1Other').value.trim(),
      q2: val('q2'), q3: val('q3')
    };
    const missing =
      !d.clinic ? '請選擇診所' :
      !d.consultant ? '請選擇諮詢師（不記得可以選「不記得名字」）' :
      !d.q1.length ? '請回答 Q1（可複選）' :
      (d.q1.indexOf('其他') >= 0 && !d.q1Other) ? '選了「其他」，請簡單寫一下原因' :
      !d.q2 ? '請回答 Q2' :
      !d.q3 ? '請回答 Q3' : '';
    if (missing) { $('err').textContent = missing; return; }

    const btn = $('submitBtn');
    btn.disabled = true; btn.textContent = '送出中…';

    const fail = msg => {
      $('err').textContent = '送出沒有成功：' + msg + '，請再按一次送出。';
      btn.disabled = false; btn.textContent = '送出回饋';
    };

    google.script.run
      .withSuccessHandler(r => {
        if (!r || !r.ok) return fail((r && r.error) || '系統忙碌');
        $('form').hidden = true;
        $('progressBar').hidden = true;
        $('promise').hidden = true;
        $('done').hidden = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .withFailureHandler(() => fail('網路連線不穩'))
      .submitFeedback(d);
  });
</script>
</body>
</html>
